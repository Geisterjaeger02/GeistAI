; GeistAI firmware
;   pio run -e tembed_cc1101 -t upload   (LilyGO T-Embed CC1101)
;   pio run -e tembed -t upload          (LilyGO T-Embed, original)
;   pio run -e cardputer -t upload       (M5Stack Cardputer)
;   pio run -e stickcplus2 -t upload     (M5StickC Plus2)
; Or flash a ready-made build in the browser: see README "Web flasher".

[platformio]
default_envs = tembed_cc1101  ; Valentin's board (works with the CC1101 pin map)
boards_dir = boards

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = chain+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------- LilyGO
[lilygo]
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.1.16
    mathertel/RotaryEncoder@^1.5.3

[env:tembed]
; Same ESP32-S3 module (16 MB flash, 8 MB OPI PSRAM) LilyGO uses for its own T-Embed examples
board = lilygo-t-display-s3
board_build.partitions = ${lilygo.board_build.partitions}
build_flags = ${lilygo.build_flags} -DGEIST_BOARD_TEMBED
lib_deps =
    ${lilygo.lib_deps}
    pololu/APA102@^3.0.0

[env:tembed_cc1101]
board = lilygo-t-embed-cc1101
board_build.partitions = ${lilygo.board_build.partitions}
build_flags = ${lilygo.build_flags} -DGEIST_BOARD_TEMBED_CC1101
lib_deps =
    ${lilygo.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.3

; ---------------------------------------------------------------- M5Stack
[env:cardputer]
; StampS3: ESP32-S3FN8, 8 MB flash, no PSRAM (audio is streamed to the server)
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGEIST_BOARD_CARDPUTER
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@^0.2.7
    m5stack/M5Cardputer@^1.1.0
    adafruit/Adafruit NeoPixel@^1.12.3

[env:stickcplus2]
; ESP32-PICO-V3-02: 8 MB flash, 2 MB PSRAM
board = m5stick-c
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DGEIST_BOARD_STICKCPLUS2
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@^0.2.7
