; GeistAI firmware for the LilyGO T-Embed
;   pio run -e tembed -t upload          (original T-Embed, ESP32-S3)
;   pio run -e tembed_cc1101 -t upload   (T-Embed CC1101)

[platformio]
default_envs = tembed_cc1101  ; Valentin's board (works with the CC1101 pin map)
boards_dir = boards

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.2.0
    mathertel/RotaryEncoder@^1.5.3

[env:tembed]
; Same ESP32-S3 module (16 MB flash, 8 MB OPI PSRAM) LilyGO uses for its own T-Embed examples
board = lilygo-t-display-s3
build_flags = ${env.build_flags} -DGEIST_BOARD_TEMBED
lib_deps =
    ${env.lib_deps}
    pololu/APA102@^3.0.0

[env:tembed_cc1101]
board = lilygo-t-embed-cc1101
build_flags = ${env.build_flags} -DGEIST_BOARD_TEMBED_CC1101
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.3
